<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CM Timetable">
<link rel="manifest" href="manifest.json">
<title>CM Timetable</title>
<style>
*{box-sizing:border-box}html{background:#090a0f}body{margin:0;background:#090a0f;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(38px + env(safe-area-inset-bottom))}
h1{font-size:32px;margin:0 0 5px;letter-spacing:-.8px}.sub{color:#999da8;font-size:14px}.days{display:flex;gap:8px;overflow-x:auto;padding:18px 0 12px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;border:0;border-radius:18px;padding:10px 16px;background:#191b23;color:#b9bdc8;font-weight:750;font-size:14px}.days button.active{background:#f5f5f7;color:#111}
.today-label{font-size:12px;color:#42d392;font-weight:800;margin:4px 0 8px;text-transform:uppercase;letter-spacing:.7px}
.card{background:#151720;border:1px solid #242733;border-radius:22px;padding:16px;margin:10px 0;transition:.2s}.card.today{border-color:#42d392;box-shadow:0 0 0 1px #42d39233}.time{font-size:13px;color:#9da2b0}.name{font-size:19px;font-weight:750;margin:4px 0}.meta{color:#a9adba;font-size:14px;line-height:1.35}.break{opacity:.62}
.help{background:#171922;border-radius:18px;padding:14px;margin-top:18px;color:#bbb;font-size:14px;line-height:1.45}.hint{color:#7e8491;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>CM Timetable</h1>
<div class="sub">Dharampeth Polytechnic Nagpur · FY-4 · Winter Session 2026</div>
<div class="days" id="days"></div>
<section id="list"></section>
<div class="help">📱 <b>iPhone:</b> open this site in Safari → Share → <b>Add to Home Screen</b>.</div>
<div class="hint">Swipe left/right to change the day.</div>
</main>
<script>
const schedule={
Monday:[
["10:00–11:00","EGG","Theory","PSR"],["11:00–12:00","BMS","Theory","APB"],["12:00–12:20","LONG RECESS","Break",""],["12:20–1:20","ENG","Theory","ARP"],["1:20–2:20","BMS","Tutorial","APB"],["2:20–2:30","SHORT RECESS","Break",""],["2:30–4:30","WORKSHOP","Practical","AAW"]],
Tuesday:[
["10:00–11:00","ENG","Theory","ARP"],["11:00–12:00","BMS","Theory","APB"],["12:00–12:20","LONG RECESS","Break",""],["12:20–2:20","ICT (B1) / ECH (B2)","Practical / Practical","PPW / SDH"],["2:20–2:30","SHORT RECESS","Break",""],["2:30–4:30","EGG (B1) / EGG (B2)","Practical / Practical","PSR"]],
Wednesday:[
["10:00–11:00","EGG","Theory","PSR"],["11:00–12:00","BMS","Theory","APB"],["12:00–12:20","LONG RECESS","Break",""],["12:20–2:20","EPH (B1) / ICT (B2)","Practical / Practical","JVC / PPW"],["2:20–2:30","SHORT RECESS","Break",""],["2:30–4:30","ECH (B1) / ENG (B2)","Practical / Practical","SDH / ARP"]],
Thursday:[
["10:00–11:00","EPH","Theory","JVC"],["11:00–12:00","BMS","Theory","APB"],["12:00–12:20","LONG RECESS","Break",""],["12:20–2:20","ENG (B1) / EPH (B2)","Practical / Practical","ARP / JVC"],["2:20–2:30","SHORT RECESS","Break",""],["2:30–4:30","ECH (B1) / WORKSHOP (B2)","Practical / Practical","SDH / AAW"]],
Friday:[
["10:00–11:00","Yoga and Meditation","Activity","SBW"],["11:00–12:00","BMS","Theory","APB"],["12:00–12:20","LONG RECESS","Break",""],["12:20–1:20","ECH","Theory","SDH"],["1:20–2:20","ICT","Theory","PPW"],["2:20–2:30","SHORT RECESS","Break",""],["2:30–3:30","BMS","Tutorial","APB"],["3:30–4:30","Library","Self Study",""]],
Saturday:[
["10:00–11:00","ECH","Theory","SDH"],["11:00–12:00","ENG","Theory","ARP"],["12:00–12:20","LONG RECESS","Break",""],["12:20–2:20","WORKSHOP (B1) / ECH (B2)","Practical / Practical","ARN, PMR / SDH"],["2:20–2:30","SHORT RECESS","Break",""],["2:30–4:30","EGG (B1) / EGG (B2)","Practical / Practical","PSR"]]
};
const teachers={JVC:"Mrs. J. V. Chate",ARP:"Mrs. A. R. Puranik",SDH:"Ms. S. D. Harsulkar",SBW:"Mrs. S. B. Wekhande",APB:"Ms. A. P. Birthariya",PSR:"Mr. P. S. Renghe",PPW:"Ms. P. P. Wankhede",AAW:"Mrs. A. A. Wadgure",ARN:"Mr. A. R. Naik",PMR:"Mr. P. M. Rithe"};
const days=Object.keys(schedule);
const realDay=new Date().getDay();
let idx=realDay>=1&&realDay<=6?realDay-1:0;
function render(){
document.querySelector("#days").innerHTML=days.map((x,i)=>'<button class="'+(i===idx?"active":"")+'" onclick="idx='+i+';render()">'+x.slice(0,3)+'</button>').join("");
document.querySelector("#list").innerHTML=schedule[days[idx]].map(x=>'<div class="card '+(x[2]==="Break"?"break":"")+'"><div class="time">'+x[0]+'</div><div class="name">'+x[1]+'</div><div class="meta">'+x[2]+(x[3]?" · "+x[3].split(" / ").map(t=>teachers[t]||t).join(" / "):"")+'</div></div>').join("");
if(idx===realDay-1&&realDay>=1&&realDay<=6)document.querySelector("#list").insertAdjacentHTML("afterbegin",'<div class="today-label">Today</div>');
}
let sx=0;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60){idx=(idx+(dx<0?1:5))%6;render()}},{passive:true});
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
