<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><link rel="manifest" href="manifest.json"><title>CM Timetable</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0f;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 40px}.sub{color:#999}.days{display:flex;gap:8px;overflow:auto;padding:14px 0}.days button{border:0;border-radius:18px;padding:10px 16px;background:#191b23;color:#bbb;font-weight:700}.days button.active{background:#fff;color:#111}.card{background:#151720;border:1px solid #242733;border-radius:22px;padding:16px;margin:10px 0}.time{font-size:13px;color:#9da2b0}.name{font-size:19px;font-weight:750;margin:4px 0}.meta{color:#a9adba;font-size:14px}.today{border-color:#42d392;box-shadow:0 0 0 1px #42d39222}.now{font-size:12px;color:#42d392;font-weight:800}.break{opacity:.7}.help{background:#171922;border-radius:18px;padding:14px;margin-top:18px;color:#bbb;font-size:14px}</style></head><body><main><h1>CM Timetable</h1><div class="sub">Your weekly class schedule</div><div class="days" id="days"></div><section id="list"></section><div class="help">📱 On iPhone: open this page in Safari → Share → <b>Add to Home Screen</b>.</div></main><script>

const days=Object.keys(d);let idx=Math.max(0,new Date().getDay()-1);if(idx>5)idx=0;
function render(){document.querySelector("#days").innerHTML=days.map((x,i)=>`<button class="${i===idx?"active":""}" onclick="idx=${i};render()">${x.slice(0,3)}</button>`).join("");document.querySelector("#list").innerHTML=d[days[idx]].map((x,i)=>`<div class="card ${x[2]=="Break"?"break":""}"><div class="time">${x[0]}</div><div class="name">${x[1]}</div><div class="meta">${x[2]}${x[3]?" · "+x[3].split(" / ").map(t=>teachers[t]||t).join(" / "):""}</div></div>`).join("")}
let sx=0;document.addEventListener("touchstart",e=>sx=e.touches[0].clientX);document.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60){idx=(idx+(dx<0?1:5))%6;render()}});render();
